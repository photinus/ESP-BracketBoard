<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>BracketBoard manual</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:8px;background:#111;color:#eee;font:16px system-ui,sans-serif;touch-action:manipulation}
#lock{display:none;background:#b71c1c;color:#fff;text-align:center;font-weight:700;padding:10px;border-radius:8px;margin-bottom:8px}
#tok{display:none;margin-bottom:8px;gap:6px}#tok input{flex:1;font-size:18px;padding:10px;border-radius:8px;border:0}
#disp{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center;margin-bottom:8px}
.sc{font-size:min(22vw,120px);font-weight:800;line-height:1}
#L .sc{color:#e53935}#R .sc{color:#43a047}.sw #L .sc{color:#43a047}.sw #R .sc{color:#e53935}
#clk{font-size:min(14vw,72px);font-weight:700;font-variant-numeric:tabular-nums}
#meta{font-size:14px;opacity:.8}
.row{display:grid;gap:8px;margin-bottom:8px}.c2{grid-template-columns:1fr 1fr}.c3{grid-template-columns:repeat(3,1fr)}.c4{grid-template-columns:repeat(4,1fr)}
button{min-height:64px;font-size:20px;font-weight:700;border:0;border-radius:12px;background:#37474f;color:#fff}
button:active{filter:brightness(1.4)}button:disabled{opacity:.35}
.go{background:#2e7d32}.stop{background:#c62828}.inj{background:#ef6c00}
.side{display:grid;grid-template-columns:1fr 1fr;gap:8px}h3{margin:4px 0;font-size:14px;opacity:.7;grid-column:1/-1}
input.f{font-size:20px;padding:12px;border-radius:10px;border:0;width:100%;text-align:center}
</style></head><body>
<div id="lock">LOCKED (agent connected)</div>
<div id="tok" class="row c2" style="grid-template-columns:1fr auto"><input id="tin" placeholder="control token" autocapitalize="off" autocomplete="off"><button onclick="saveTok()">Save</button></div>
<div id="disp"><div id="L"><div class="sc" id="ls">0</div><div id="lw"></div></div>
<div><div id="clk">-:--</div><div id="meta"></div></div>
<div id="R"><div class="sc" id="rs">0</div><div id="rw"></div></div></div>
<div class="row c3"><button class="go" onclick="cmd({cmd:'clock_start'})">START</button>
<button class="stop" onclick="cmd({cmd:'clock_stop'})">STOP</button>
<button class="inj" onclick="cmd({cmd:'clock_injury'})">INJURY</button></div>
<div class="side"><h3>LEFT</h3>
<div class="row c4" style="grid-column:1/-1;margin:0"><button onclick="sc('left',1)">+1</button><button onclick="sc('left',2)">+2</button><button onclick="sc('left',3)">+3</button><button onclick="sc('left',4)">+4</button></div>
<button onclick="sc('left',-1)">-1</button><button onclick="wn('left')">WARN</button>
<h3>RIGHT</h3>
<div class="row c4" style="grid-column:1/-1;margin:0"><button onclick="sc('right',1)">+1</button><button onclick="sc('right',2)">+2</button><button onclick="sc('right',3)">+3</button><button onclick="sc('right',4)">+4</button></div>
<button onclick="sc('right',-1)">-1</button><button onclick="wn('right')">WARN</button></div>
<div class="row c3" style="margin-top:8px"><button onclick="per(-1)">PERIOD -</button><button id="pd" disabled>P1</button><button onclick="per(1)">PERIOD +</button></div>
<div class="row c2"><input class="f" id="cin" value="2:00" inputmode="numeric"><button onclick="setClk()">SET CLOCK</button></div>
<div class="row c3"><button onclick="cmd({cmd:'swap'})">SWAP</button>
<button onclick="cmd({cmd:'splash',value:!st.splash})">SPLASH</button>
<button onclick="if(confirm('Reset everything?'))cmd({cmd:'reset'})">RESET</button></div>
<script>
var st={period:1,splash:false},tok=null,locked=false;
try{tok=localStorage.getItem('bbtoken')}catch(e){}
function $(i){return document.getElementById(i)}
function hdr(){return {'Authorization':'Bearer '+tok}}
function needTok(on){$('tok').style.display=on?'grid':'none'}
function saveTok(){tok=$('tin').value.trim();try{localStorage.setItem('bbtoken',tok)}catch(e){}needTok(false)}
function setLock(on,msg){locked=on;$('lock').style.display=on?'block':'none';if(msg)$('lock').textContent=msg;
 document.querySelectorAll('button').forEach(function(b){if(b.id!=='pd'&&!b.closest('#tok'))b.disabled=on})}
function cmd(o){if(!tok){needTok(true);return}
 fetch('/manual/cmd',{method:'POST',headers:hdr(),body:JSON.stringify(o)}).then(function(r){
  if(r.status===409)setLock(true,'LOCKED (agent connected)');else if(r.status===401){tok=null;needTok(true)}
  else if(r.status===200)poll1()}).catch(function(){})}
function sc(s,d){cmd({cmd:'score',side:s,delta:d})}
function wn(s){cmd({cmd:'warning',side:s,delta:1})}
function per(d){var p=Math.min(9,Math.max(1,st.period+d));cmd({cmd:'period',value:p})}
function setClk(){var m=/^(\d{1,3}):([0-5]\d)$/.exec($('cin').value.trim());
 if(!m){alert('Use M:SS');return}cmd({cmd:'clock_set',ms:(+m[1]*60+ +m[2])*1000})}
function fmt(ms){var s=Math.ceil(Math.max(0,ms)/1000);return Math.floor(s/60)+':'+('0'+s%60).slice(-2)}
function show(s){st={period:s.period,splash:s.screen==='splash'};$('ls').textContent=s.left_score;$('rs').textContent=s.right_score;
 $('lw').textContent='W'+s.left_warnings;$('rw').textContent='W'+s.right_warnings;$('clk').textContent=fmt(s.clock_ms_remaining);
 $('meta').textContent=s.clock_state.toUpperCase();$('pd').textContent='P'+s.period;
 document.body.className=s.colors_swapped?'sw':''}
function poll1(){if(!tok){needTok(true);return Promise.resolve()}
 return fetch('/manual/state',{headers:hdr(),cache:'no-store'}).then(function(r){
  if(r.status===401){tok=null;needTok(true);return}
  if(r.status===409){setLock(true,'LOCKED (agent connected)');return}
  return r.json().then(show)}).catch(function(){})}
function stat(){fetch('/status',{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){
 if(j.mode==='agent'){setLock(true,j.agent_live?'LOCKED (agent connected)':'LOCKED (manual mode disabled)')}
 else if(locked)setLock(false)}).catch(function(){})}
(function loop(){poll1().then(function(){setTimeout(loop,250)})})();
setInterval(stat,1000);stat();
</script></body></html>
